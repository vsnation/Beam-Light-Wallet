name: CI

on:
  push:
    branches: [main, productisation]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python file
        run: python -m compileall -q serve.py tests/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse every shipped JS file
        run: |
          fail=0
          for f in $(git ls-files 'src/**/*.js'); do
            node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Shell scripts parse
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: config/binaries.json is valid and complete
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open('config/binaries.json'))
          assert m.get('app_version'), 'app_version missing'
          assert m.get('min_consensus_height'), 'min_consensus_height missing'
          for name, p in m['platforms'].items():
              assert p.get('beam_version'), f'{name}: beam_version missing'
              assert 'hf6_compatible' in p, f'{name}: hf6_compatible missing'
          print('manifest OK:', m['app_version'])
          PY

  no-drift:
    name: No hardcoded versions or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The whole point of config/binaries.json is that these live in one place.
      # A stray literal is how shipping the HF6 hotfix would silently miss a file.
      - name: No hardcoded BEAM version outside the manifest
        run: |
          hits=$(grep -rnE '7\.5\.(13882|14493)' \
                   --include='*.sh' --include='*.bat' --include='*.ps1' \
                   --include='*.iss' --include='*.js' --include='*.py' . \
                 | grep -v 'config/binaries.json' \
                 | grep -v '^./docs/' \
                 | grep -v '^./scripts/' || true)
          if [ -n "$hits" ]; then
            echo "::error::BEAM version hardcoded outside config/binaries.json:"
            echo "$hits"
            exit 1
          fi

      - name: No wallet passwords committed
        run: |
          if grep -rn 'BeamTest2024' --include='*.py' --include='*.js' --include='*.sh' . ; then
            echo "::error::a wallet password is committed"
            exit 1
          fi

      # The frontend used to construct a DMG filename and link straight to it.
      # v1.0.5 shipped Beam-Light-Wallet-1.0.5.dmg while the frontend asked for
      # BEAM-LightWallet-1.0.5.dmg, and later releases ship no DMG at all, so
      # every in-app "Update Now" click landed on a GitHub 404. The links now
      # point at the release tag page, which cannot drift. Keep it that way.
      - name: Update links point at a release page, not a guessed filename
        run: |
          bad=$(grep -n 'releases/download/[^"`]*\.dmg' src/js/app.js || true)
          if [ -n "$bad" ]; then
            echo "::error::app.js links directly to a DMG asset; use the release tag page instead"
            echo "$bad"
            exit 1
          fi
          if ! grep -q 'releases/tag/v' src/js/app.js; then
            echo "::error::no release-page link found in app.js — the guard would pass vacuously"
            exit 1
          fi
          echo "update links OK"

      # Every credential that reached this repo did so through a broad `git add`.
      # This is the same scan the pre-push hook runs, so CI catches it even if
      # someone pushes without hooks installed.
      - name: No credentials committed
        run: |
          hits=$(grep -rInE '[0-9]{9,10}:AA[A-Za-z0-9_-]{33}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}' \
                   --exclude-dir=.git --exclude='ci.yml' --exclude-dir=.githooks . || true)
          if [ -n "$hits" ]; then
            echo "::error::a credential is committed:"
            echo "$hits" | head -5
            exit 1
          fi
          echo "no credentials found"

      # The DMG must be built from a git ref, not the working tree, or untracked
      # files ship to users. That is how a live API token nearly went out.
      - name: DMG builds from the committed tree
        run: |
          # Ignore comment lines: the script explains the old approach in prose.
          if grep -vE '^\s*#' build/macos/create-dmg.sh \
             | grep -qE 'cp -r "\$PROJECT_DIR/(src|config|shaders)"'; then
            echo "::error::create-dmg.sh copies the working tree; it must use git archive"
            exit 1
          fi
          grep -q 'git .*archive' build/macos/create-dmg.sh || {
            echo "::error::create-dmg.sh no longer exports from git"; exit 1; }
          echo "DMG source OK"

  ui-smoke:
    name: Headless UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install selenium

      - name: Start the wallet server
        run: |
          python3 serve.py 9080 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9080/api/status >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9080/api/status

      # No wallet, no funds — this exercises the unlock screen, routing and the
      # security guards, which is exactly what regresses silently.
      - name: UI smoke
        run: python3 tests/test_selenium.py --headless
        env:
          BEAM_TEST_PASSWORD: ${{ secrets.BEAM_TEST_PASSWORD }}

      - name: Security guards still hold
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9080/api/wallet \
                   -H 'Content-Type: application/json' -H 'Origin: https://evil.example' -d '{}')
          [ "$code" = "403" ] || { echo "::error::cross-origin POST was not rejected (got $code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE 'http://127.0.0.1:9080/api/wallet/%2e%2e')
          [ "$code" = "403" ] || [ "$code" = "400" ] || { echo "::error::path traversal not rejected (got $code)"; exit 1; }
          echo "guards OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
